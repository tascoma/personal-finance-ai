name: PersonalFinanceAI

options:
  bundleIdPrefix: com.tascoma
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Staging: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

schemes:
  PersonalFinanceAI:
    build:
      targets:
        PersonalFinanceAI: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  PersonalFinanceAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - App
      - Core
      - Features
      - Shared
    info:
      path: App/Generated-Info.plist
      properties:
        CFBundleDisplayName: $(DISPLAY_NAME)
        UILaunchScreen: {}
        API_BASE_URL: $(API_BASE_URL)
        APNS_SANDBOX: $(APNS_SANDBOX)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSFaceIDUsageDescription: "Personal Finance uses Face ID to protect your financial data."
    entitlements:
      path: App/PersonalFinanceAI.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tascoma.personalfinanceai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tascoma.personalfinanceai
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/PersonalFinanceAI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.tascoma.personalfinanceai.stage
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconStage
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.tascoma.personalfinanceai.stage
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconStage
    dependencies:
      - target: PersonalFinanceWidget

  PersonalFinanceWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Generated-Info.plist
      properties:
        CFBundleDisplayName: $(DISPLAY_NAME) Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/PersonalFinanceWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tascoma.personalfinanceai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tascoma.personalfinanceai.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widget/PersonalFinanceWidget.entitlements
        SKIP_INSTALL: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.tascoma.personalfinanceai.stage.widget
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.tascoma.personalfinanceai.stage.widget
