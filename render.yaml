services:
  - type: web
    name: personal-finance-ai
    env: docker
    plan: starter
    branch: main
    healthCheckPath: /health
    preDeployCommand: cd backend && uv run alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pfa-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: ALLOWED_ORIGINS
        sync: false
      # Literal names/addresses redacted from every LLM prompt. Regex rules in
      # app.services.scrub handle account numbers, PANs, SSNs, and addresses.
      - key: PII_IDENTITY_TERMS
        sync: false
      - key: SCRUB_BEFORE_LLM
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      # APNs (iOS push) — leave unset until Apple Developer credentials are
      # provisioned; backend's notify_user() is a graceful no-op without them.
      - key: APNS_AUTH_KEY_P8
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_BUNDLE_ID
        value: com.tascoma.personalfinanceai
      - key: APNS_USE_SANDBOX
        value: "false"

  - type: web
    name: personal-finance-ai-stage
    env: docker
    plan: starter
    branch: dev
    healthCheckPath: /health
    preDeployCommand: cd backend && uv run alembic upgrade head
    envVars:
      - key: APP_ENV
        value: staging
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pfa-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: ALLOWED_ORIGINS
        sync: false
      # Literal names/addresses redacted from every LLM prompt. Regex rules in
      # app.services.scrub handle account numbers, PANs, SSNs, and addresses.
      - key: PII_IDENTITY_TERMS
        sync: false
      - key: SCRUB_BEFORE_LLM
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      # APNs (iOS push). Stage targets APNs sandbox so Debug/Staging iOS
      # builds can deliver here.
      - key: APNS_AUTH_KEY_P8
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_BUNDLE_ID
        value: com.tascoma.personalfinanceai
      - key: APNS_USE_SANDBOX
        value: "true"

databases:
  - name: pfa-db
    plan: starter
    postgresMajorVersion: "16"
